<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polymarket - Atualização Automática de Odds</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f2;--card:#fff;--tx:#1a1a1a;--mut:#6b6b6b;--bd:#ddd9d0;--ok:#157a3b;--okbg:#e3f4e8;--no:#b3261e;--nobg:#fbe9e7;--ac:#c8102e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--tx:#eee;--mut:#9a9a9a;--bd:#333;--ok:#5fd68a;--okbg:#14301f;--no:#ff8a80;--nobg:#3a1a17;--ac:#ff4d5e}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--tx:#eee;--mut:#9a9a9a;--bd:#333;--ok:#5fd68a;--okbg:#14301f;--no:#ff8a80;--nobg:#3a1a17;--ac:#ff4d5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:10px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{width:100%;padding:10px;font-size:1rem;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
input[readonly]{opacity:.8;cursor:not-allowed}
h2{font-size:.95rem;margin:0 0 10px;color:var(--ac)}
.note{font-size:.78rem;color:var(--mut)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<h1>Polymarket UFC · odds em Tempo Real</h1>
<p class="s">Selecione uma luta no menu para puxar os preços/odds automaticamente da API da Polymarket.</p>

<div class="card">
<h2>1. Seleção da Luta</h2>
<button id="bl" type="button">Carregar eventos UFC</button>
<div style="margin-top:10px">
  <label for="se">Luta do UFC</label>
  <select id="se">
    <option value="">Aguardando carregamento dos eventos...</option>
  </select>
</div>
<p class="note" id="st" style="margin:8px 0 0">Aguardando ação...</p>
</div>

<div class="card">
<h2>2. Odds Polymarket (Atualizadas Automáticas)</h2>
<div class="grid">
  <div>
    <label id="lpa">Lutador A (¢)</label>
    <input id="pa" type="number" readonly step="0.1" value="0">
  </div>
  <div>
    <label id="lpb">Lutador B (¢)</label>
    <input id="pb" type="number" readonly step="0.1" value="0">
  </div>
</div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const GAMMA_API='https://gamma-api.polymarket.com';
let FL=[];

const st=t=>$('st').innerHTML=t;
const arr=v=>{try{return typeof v==='string'?JSON.parse(v):(v||[])}catch{return[]}};

function opt(sel,items){
  sel.innerHTML='';
  items.forEach(([v,t])=>{
    const o=document.createElement('option');
    o.value=v;
    o.textContent=t;
    sel.appendChild(o);
  });
}

// 1. Busca todos os eventos ativos do UFC na Polymarket
async function loadEvents(){
  st('<span class="spinner"></span> Carregando lutas do UFC na Polymarket...');
  try{
    const r=await fetch(GAMMA_API+'/events?tag_slug=ufc&active=true&closed=false&limit=100');
    if(!r.ok) throw new Error('HTTP '+r.status);
    
    const events=await r.json();
    events.sort((a,b)=>new Date(a.endDate||a.startDate||0)-new Date(b.endDate||b.startDate||0));
    
    if(!events.length){
      st('Nenhum evento UFC ativo encontrado.');
      opt($('se'), [['', 'Nenhuma luta encontrada']]);
      return;
    }
    
    const bad=/^(yes|no|over|under|draw)$/i;
    FL=[];
    events.forEach(e=>{
      const markets=(e.markets||[]).filter(m=>m.active!==false&&!m.closed).filter(m=>{
        const o=arr(m.outcomes);
        return o.length==2&&!bad.test(o[0])&&!bad.test(o[1]);
      });
      
      markets.forEach(m=>FL.push({
        market: m,
        label: markets.length>1 ? e.title+' — '+(m.groupItemTitle||m.question) : e.title
      }));
    });

    if(!FL.length){
      st('Nenhuma luta válida com 2 lutadores encontrada.');
      opt($('se'), [['', 'Nenhum mercado válido disponível']]);
      return;
    }

    opt($('se'), FL.map((x,i)=>[i, x.label]));
    st(`✅ ${FL.length} lutas carregadas! Atualizando odds...`);
    
    // Atualiza as odds da primeira luta selecionada automaticamente
    await updatePolymarketOdds();

  }catch(e){
    st('Erro ao conectar na API da Polymarket: '+e.message);
  }
}

// 2. Busca e atualiza as odds automaticamente ao mudar a opção
async function updatePolymarketOdds(){
  const sel=$('se');
  if(sel.value === '' || !FL[+sel.value]) return;
  
  const selectedItem = FL[+sel.value];
  const market = selectedItem.market;
  
  st('<span class="spinner"></span> Atualizando odds da Polymarket...');
  
  try {
    // Faz a chamada direta à API para pegar os dados em tempo real do mercado específico
    const r = await fetch(GAMMA_API + '/markets/' + market.id);
    const updatedMarket = r.ok ? await r.json() : market;
    
    const outcomes = arr(updatedMarket.outcomes);
    const prices = arr(updatedMarket.outcomePrices).map(Number);
    
    if(outcomes.length >= 2 && prices.length >= 2){
      // Nomes dos lutadores
      $('lpa').textContent = outcomes[0] + ' (¢)';
      $('lpb').textContent = outcomes[1] + ' (¢)';
      
      // Converte preço decimal (ex: 0.62) para centavos (ex: 62.0)
      $('pa').value = (prices[0] * 100).toFixed(1);$('pb').value = (prices[1] * 100).toFixed(1);
      
      st('⚡ Odds da Polymarket atualizadas com sucesso às ' + new Date().toLocaleTimeString('pt-BR'));
    } else {
      st('⚠️ Não foi possível ler as odds para esta luta.');
    }
  } catch(e) {
    st('Erro ao buscar odds atualizadas: ' + e.message);
  }
}

// Vincular eventos de mudança do menu
$('se').addEventListener('change', updatePolymarketOdds);$('bl').onclick = loadEvents;

// Carregamento automático ao abrir a página
window.onload = loadEvents;
</script>
</body>
</html>
