<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonding Radar</title>
  <style>
    :root { --bg:#0b1020; --panel:#151c32; --border:#2e3b62; --text:#f1f5ff; --muted:#aab7d6; --blue:#4f7cff; --green:#35d39a; --red:#ff7280; --yellow:#f7c948; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
    header { padding:28px 20px; border-bottom:1px solid var(--border); background:#11182d; }
    .container { width:min(1100px,calc(100% - 32px)); margin:0 auto; }
    h1 { margin:0; font-size:clamp(1.6rem,4vw,2.3rem); }
    .subtitulo { margin:10px 0 0; color:var(--muted); line-height:1.5; }
    main { padding:32px 0 48px; }
    .panel,.card,.message { border:1px solid var(--border); border-radius:14px; background:var(--panel); }
    .panel { padding:20px; margin-bottom:24px; }
    .panel h2 { margin:0 0 8px; font-size:1.15rem; }
    .help { margin:0 0 18px; color:var(--muted); line-height:1.5; }
    .filters { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:14px; }
    .field { display:grid; gap:7px; }
    label { color:var(--muted); font-size:.9rem; }
    input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; background:#0c1224; color:var(--text); font:inherit; }
    input:focus { outline:2px solid var(--blue); outline-offset:1px; }
    .actions,.bar { display:flex; flex-wrap:wrap; gap:10px; }
    .actions { margin-top:18px; }
    .bar { justify-content:space-between; align-items:center; margin-bottom:20px; }
    button,.link-button { display:inline-flex; align-items:center; justify-content:center; padding:11px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:bold; cursor:pointer; text-decoration:none; }
    button:hover:not(:disabled),.link-button:hover { filter:brightness(1.1); }
    button:disabled { opacity:.65; cursor:wait; }
    .secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
    .status { margin:0; color:var(--muted); line-height:1.5; }
    .markets { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:16px; }
    .card { display:flex; flex-direction:column; min-height:390px; padding:20px; }
    .badge { display:inline-flex; align-self:flex-start; margin-bottom:14px; padding:6px 10px; border-radius:999px; background:rgba(247,201,72,.12); color:var(--yellow); font-size:.78rem; font-weight:bold; letter-spacing:.04em; text-transform:uppercase; }
    .question { margin:0 0 16px; font-size:1.05rem; line-height:1.45; }
    .highlights { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:auto; }
    .highlight { padding:12px; border-radius:10px; text-align:center; font-weight:bold; line-height:1.45; }
    .positive { background:rgba(53,211,154,.12); color:var(--green); }
    .negative { background:rgba(255,114,128,.12); color:var(--red); }
    .details { display:grid; gap:10px; margin-top:14px; }
    .row { display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:.9rem; line-height:1.4; }
    .row strong { color:var(--text); text-align:right; }
    .footer { margin-top:20px; }
    .footer .link-button { width:100%; }
    .message { grid-column:1 / -1; padding:24px; color:var(--muted); text-align:center; line-height:1.6; }
    .message.error { border-color:rgba(255,114,128,.55); background:rgba(255,114,128,.1); color:#ffd8dc; }
    @media (max-width:800px) { .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:480px) { .filters { grid-template-columns:1fr; } .bar { align-items:stretch; } .bar button { width:100%; } }
  </style>
</head>
<body>
  <header><div class="container"><h1>Painel Polymarket</h1><p class="subtitulo">Consulte mercados abertos por prazo, probabilidade e liquidez.</p></div></header>
  <main class="container">
    <section class="panel">
      <h2>Filtros de mercado</h2>
      <p class="help">Ajuste os valores e clique em “Aplicar filtros”.</p>
      <form id="formulario">
        <div class="filters">
          <div class="field"><label for="dias">Resolução em até (dias)</label><input id="dias" type="number" min="1" max="30" value="7"></div>
          <div class="field"><label for="prob-min">Probabilidade mínima (%)</label><input id="prob-min" type="number" min="1" max="99" step="0.1" value="90"></div>
          <div class="field"><label for="prob-max">Probabilidade máxima (%)</label><input id="prob-max" type="number" min="1" max="99" step="0.1" value="99"></div>
          <div class="field"><label for="liquidez">Liquidez mínima (US$)</label><input id="liquidez" type="number" min="0" step="1000" value="10000"></div>
        </div>
        <div class="actions"><button id="aplicar" type="submit">Aplicar filtros</button><button id="restaurar" class="secondary" type="button">Restaurar padrão</button></div>
      </form>
    </section>
    <div class="bar"><p id="status" class="status">Aguardando consulta...</p><button id="atualizar" type="button">Atualizar dados</button></div>
    <section id="resultados" class="markets"><div class="message">A página foi carregada. Consultando a Polymarket...</div></section>
  </main>
  <script>
    (function () {
      "use strict";
      var TAMANHO_PAGINA=100, TOTAL_DE_PAGINAS=10;
      var formulario=document.getElementById("formulario"), campoDias=document.getElementById("dias"), campoProbMin=document.getElementById("prob-min"), campoProbMax=document.getElementById("prob-max"), campoLiquidez=document.getElementById("liquidez"), botaoAplicar=document.getElementById("aplicar"), botaoRestaurar=document.getElementById("restaurar"), botaoAtualizar=document.getElementById("atualizar"), status=document.getElementById("status"), resultados=document.getElementById("resultados");
      function esc(v){var e=document.createElement("div");e.textContent=v==null?"":String(v);return e.innerHTML;}
      function money(v){var n=Number(v);return isFinite(n)?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n):"Não informado";}
      function arr(v){if(Array.isArray(v))return v;if(typeof v==="string"){try{var x=JSON.parse(v);return Array.isArray(x)?x:[];}catch(e){return [];}}return [];}
      function filters(){var d=Number(campoDias.value),a=Number(campoProbMin.value),b=Number(campoProbMax.value),l=Number(campoLiquidez.value);if(!isFinite(d)||d<1||d>30)throw new Error("Informe entre 1 e 30 dias.");if(!isFinite(a)||!isFinite(b)||a<1||b>99||a>b)throw new Error("A probabilidade mínima deve ser menor ou igual à máxima, entre 1% e 99%.");if(!isFinite(l)||l<0)throw new Error("A liquidez mínima deve ser zero ou maior.");return{dias:d,pmin:a/100,pmax:b/100,probMin:a,probMax:b,liq:l};}
      function endDate(m){var xs=[m.endDateIso,m.endDate,m.umaEndDateIso,m.umaEndDate];for(var i=0;i<xs.length;i++){if(xs[i]){var d=new Date(xs[i]);if(!isNaN(d.getTime()))return d;}}return null;}
      function hours(m){var d=endDate(m);return d?(d.getTime()-Date.now())/3600000:null;}
      function time(h){if(!isFinite(h))return"Não informado";if(h<=0)return"Em resolução";var d=Math.floor(h/24),r=Math.floor(h%24);return d>0?d+"d e "+r+"h":r+"h";}
      function exactDate(m){var d=endDate(m);return d?new Intl.DateTimeFormat("pt-BR",{dateStyle:"medium",timeStyle:"short"}).format(d):"Não informada";}
      function firstNumber(xs){for(var i=0;i<xs.length;i++){var n=Number(xs[i]);if(isFinite(n)&&n>=0)return n;}return null;}
      function liquidity(m){var n=firstNumber([m.liquidityClob,m.liquidityNum,m.liquidity,m.liquidityAmm]);return n===null?0:n;}
      function volume24h(m){return firstNumber([m.volume24hrClob,m.volume24hr,m.volume24Hour,m.volume24h]);}
      function positions(m){var names=arr(m.outcomes),prices=arr(m.outcomePrices),out=[];for(var i=0;i<names.length;i++){var p=Number(prices[i]);if(isFinite(p))out.push({name:String(names[i]),price:p});}return out;}
      function eligible(m,f){var ps=positions(m);for(var i=0;i<ps.length;i++)if(ps[i].price>=f.pmin&&ps[i].price<=f.pmax)return ps[i];return null;}
      function evaluate(ms,f){var ok=[],d={received:ms.length,noDate:0,outside:0,lowLiquidity:0,price:0};for(var i=0;i<ms.length;i++){var m=ms[i],h=hours(m),l=liquidity(m),p=eligible(m,f);if(h===null){d.noDate++;continue;}if(h<=0||h>f.dias*24){d.outside++;continue;}if(l<=f.liq){d.lowLiquidity++;continue;}if(!p){d.price++;continue;}ok.push(m);}ok.sort(function(a,b){return liquidity(b)-liquidity(a);});return{ok:ok,diag:d};}
      function marketUrl(m){return m.slug?"https://polymarket.com/event/"+encodeURIComponent(m.slug):null;}
      function card(m,f){var p=eligible(m,f),q=esc(m.question||"Mercado sem título"),name=esc(p?p.name:"Resultado"),pct=p?(p.price*100).toFixed(1)+"%":"—",price=p?money(p.price):"—",v=volume24h(m),link=marketUrl(m),footer=link?'<div class="footer"><a class="link-button" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">Abrir na Polymarket</a></div>':'<div class="footer"><button type="button" disabled>Link não disponível</button></div>';return '<article class="card"><div class="badge">Lado qualificado: '+name+'</div><h2 class="question">'+q+'</h2><div class="highlights"><div class="highlight positive">'+name+'<br>'+pct+'</div><div class="highlight negative">Preço<br>'+price+'</div></div><div class="details"><div class="row"><span>Tempo para resolução</span><strong>'+esc(time(hours(m)))+'</strong></div><div class="row"><span>Encerra em</span><strong>'+esc(exactDate(m))+'</strong></div><div class="row"><span>Liquidez informada</span><strong>'+money(liquidity(m))+'</strong></div><div class="row"><span>Volume em 24h</span><strong>'+(v===null?"Não informado":money(v))+'</strong></div></div>'+footer+'</article>';}
      function loading(on){botaoAplicar.disabled=on;botaoRestaurar.disabled=on;botaoAtualizar.disabled=on;botaoAplicar.textContent=on?"Aplicando...":"Aplicar filtros";botaoAtualizar.textContent=on?"Atualizando...":"Atualizar dados";}
      function error(msg){resultados.innerHTML='<div class="message error"><strong>Não foi possível carregar os mercados.</strong><br>'+esc(msg)+'</div>';status.textContent="Ocorreu um erro na consulta.";}
      function none(d,f){resultados.innerHTML='<div class="message">Nenhum mercado atende simultaneamente aos filtros neste momento.<br><br><strong>Critérios atuais:</strong><br>Resolução em até '+f.dias+' dia(s)<br>Probabilidade entre '+f.probMin+'% e '+f.probMax+'%<br>Liquidez superior a '+money(f.liq)+'<br><br><strong>Diagnóstico:</strong><br>Recebidos da API: '+d.received+'<br>Sem data válida: '+d.noDate+'<br>Fora da janela: '+d.outside+'<br>Liquidez insuficiente: '+d.lowLiquidity+'<br>Probabilidade fora da faixa: '+d.price+'</div>';}
      function pageUrl(p){return "https://gamma-api.polymarket.com/markets?active=true&closed=false&limit="+TAMANHO_PAGINA+"&offset="+(p*TAMANHO_PAGINA);}
      function page(p){return fetch(pageUrl(p)).then(function(r){if(!r.ok)throw new Error("A API respondeu com erro "+r.status+" na página "+(p+1)+".");return r.json();});}
      function load(){var f;try{f=filters();}catch(e){error(e.message);return;}status.textContent="Consultando até 1.000 mercados da Polymarket...";resultados.innerHTML='<div class="message">Carregando mercados da Polymarket...</div>';loading(true);var jobs=[];for(var p=0;p<TOTAL_DE_PAGINAS;p++)jobs.push(page(p));Promise.all(jobs).then(function(pages){var ms=[];for(var i=0;i<pages.length;i++)if(Array.isArray(pages[i]))ms=ms.concat(pages[i]);if(!ms.length)throw new Error("A API não retornou mercados nas páginas consultadas.");var x=evaluate(ms,f);if(!x.ok.length){none(x.diag,f);status.textContent="Foram analisados "+x.diag.received+" mercados; nenhum passou nos filtros.";return;}resultados.innerHTML=x.ok.map(function(m){return card(m,f);}).join("");status.textContent=x.ok.length+" mercado(s) encontrado(s), após analisar "+ms.length+" mercados.";}).catch(function(e){console.error(e);error(e.message);}).finally(function(){loading(false);});}
      formulario.addEventListener("submit",function(e){e.preventDefault();load();});
      botaoAtualizar.addEventListener("click",load);
      botaoRestaurar.addEventListener("click",function(){campoDias.value=7;campoProbMin.value=90;campoProbMax.value=99;campoLiquidez.value=10000;load();});
      load();
    })();
  </script>
</body>
</html>
