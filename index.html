<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Polymarket</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #151c32;
      --border: #2e3b62;
      --text: #f1f5ff;
      --muted: #aab7d6;
      --blue: #4f7cff;
      --green: #35d39a;
      --red: #ff7280;
      --yellow: #f7c948;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 28px 20px;
      border-bottom: 1px solid var(--border);
      background: #11182d;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
    }

    .subtitulo {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    main {
      padding: 32px 0 48px;
    }

    .panel,
    .card,
    .message {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel {
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .help {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c1224;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .actions,
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .actions {
      margin-top: 18px;
    }

    .bar {
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    button,
    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #ffffff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover:not(:disabled),
    .link-button:hover {
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .status {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .markets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 360px;
      padding: 20px;
    }

    .question {
      margin: 0 0 16px;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .badge {
      display: inline-flex;
      align-self: flex-start;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(247, 201, 72, 0.12);
      color: var(--yellow);
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: auto;
    }

    .highlight {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.45;
    }

    .positive {
      background: rgba(53, 211, 154, 0.12);
      color: var(--green);
    }

    .negative {
      background: rgba(255, 114, 128, 0.12);
      color: var(--red);
    }

    .details {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .row strong {
      color: var(--text);
      text-align: right;
    }

    .card-footer {
      margin-top: 20px;
    }

    .card-footer .link-button {
      width: 100%;
    }

    .message {
      grid-column: 1 / -1;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .message.error {
      border-color: rgba(255, 114, 128, 0.55);
      background: rgba(255, 114, 128, 0.1);
      color: #ffd8dc;
    }

    @media (max-width: 800px) {
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
