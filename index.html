<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket Bonding Map</title>
  <style>
    :root { --bg:#0b1020; --panel:#151c32; --border:#2e3b62; --text:#f1f5ff; --muted:#aab7d6; --blue:#4f7cff; --green:#35d39a; --red:#ff7280; --yellow:#f7c948; --orange:#ff9f43; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
    header { padding:10px 20px; border-bottom:1px solid var(--border); background:#11182d; }
    .container { width:min(1180px,calc(100% - 32px)); margin:0 auto; }
    h1 { margin:0; font-size:clamp(1.6rem,4vw,2.3rem); }
    .subtitulo { margin:10px 0 0; color:var(--muted); line-height:1.5; }
    main { padding:0 0 48px; }
    .panel,.card,.message { border:1px solid var(--border); border-radius:14px; background:var(--panel); }
    .panel { padding:20px; margin-bottom:24px; }
    .panel h2 { margin:0 0 8px; font-size:1.15rem; }
    .help { margin:0 0 18px; color:var(--muted); line-height:1.5; }
    .filters { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); gap:14px; justify-content:center; }
    .field { display:grid; gap:7px; text-align:center; }
    label { color:var(--muted); font-size:.9rem; text-align:center; }
    input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; background:#0c1224; color:var(--text); font:inherit; }
    input:focus { outline:2px solid var(--blue); outline-offset:1px; }
    .check-field { display:flex; align-items:end; }
    .check-label { display:flex; align-items:center; gap:9px; min-height:43px; color:var(--text); font-size:.9rem; cursor:pointer; }
    .check-label input { width:18px; height:18px; margin:0; accent-color:var(--blue); }
    .actions,.bar { display:flex; flex-wrap:wrap; gap:10px; }
    .actions { margin-top:18px; align-items:center; }
    .actions .status { margin:0; align-self:center; display:inline-flex; align-items:center; }
    .bar { justify-content:space-between; align-items:center; margin-bottom:20px; }
    button,.link-button { display:inline-flex; align-items:center; justify-content:center; padding:11px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:bold; cursor:pointer; text-decoration:none; }
    button:hover:not(:disabled),.link-button:hover { filter:brightness(1.1); }
    button:disabled { opacity:.65; cursor:wait; }
    .secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
    .status { margin:0; color:var(--muted); line-height:1.5; }
    .markets { align-items:start; display:grid; grid-template-columns:1fr; gap:16px; }
    .card { display:flex; flex-direction:column; padding:20px; }
    .badge { display:inline-flex; align-self:flex-start; margin-bottom:14px; padding:6px 10px; border-radius:999px; background:rgba(247,201,72,.12); color:var(--yellow); font-size:.78rem; font-weight:bold; letter-spacing:.04em; text-transform:uppercase; }
    .title-row { display:flex; align-items:center; gap:14px; margin:0 0 10px; }
    .title-row .question { margin:0; flex:1; min-width:0; }
    .question { margin:0 0 16px; font-size:1.4rem; line-height:1.45; }
    .highlights { display:grid; grid-template-columns:1fr; gap:10px; margin-top:0; }
    .highlight { padding:12px; border-radius:10px; text-align:center; font-weight:bold; line-height:1.45; }
    .positive { background:rgba(53,211,154,.12); color:var(--green); }
    .negative { background:rgba(255,114,128,.12); color:var(--red); }
    .section { margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
    .section-title { margin:0 0 10px; color:var(--yellow); font-size:.85rem; letter-spacing:.04em; text-transform:uppercase; }
    .details { display:grid; gap:10px; margin-top:14px; }
    .row { display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:.9rem; line-height:1.4; }
    .row strong { color:var(--text); text-align:right; }
    .row .good { color:var(--green); }
    .row .warning { color:var(--orange); }
    .row .bad { color:var(--red); }
    .depth-ok { border-left:3px solid var(--green); padding-left:10px; }
    .depth-low { border-left:3px solid var(--orange); padding-left:10px; }
    .score-card { display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin:0; padding:6px 12px; border:1px solid rgba(247,201,72,.4); border-radius:10px; background:rgba(247,201,72,.08); }
    .score-header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
    .score-title { margin:0; color:var(--yellow); font-size:.9rem; letter-spacing:.04em; text-transform:uppercase; }
    .score-value { color:var(--text); font-size:1rem; font-weight:bold; }
    .score-details { display:grid; gap:7px; margin-top:12px; }
    .score-note { margin:10px 0 0; color:var(--muted); font-size:.8rem; line-height:1.45; }
    .market-link { color:inherit; text-decoration:none; transition:color .15s,text-shadow .15s; }
    .market-link:hover,.market-link:focus { color:var(--yellow); text-shadow:0 0 12px rgba(247,201,72,.65); outline:none; }
    .market-link:focus-visible { outline:2px solid var(--blue); outline-offset:3px; border-radius:3px; }
    .tooltip { position:relative; display:inline-flex; align-items:center; margin-left:5px; vertical-align:middle; }
    .tooltip-button { width:18px; height:18px; min-width:18px; padding:0; border:1px solid var(--border); border-radius:5px; background:#0c1224; color:var(--yellow); font-size:.75rem; font-weight:bold; line-height:1; cursor:help; }
    .tooltip-button:hover,.tooltip-button:focus { background:var(--blue); color:#fff; outline:none; }
    .tooltip-text { position:absolute; z-index:5; bottom:calc(100% + 8px); left:50%; width:250px; padding:10px; border:1px solid var(--border); border-radius:8px; background:#0c1224; color:var(--text); font-size:.78rem; font-weight:normal; line-height:1.45; text-align:left; box-shadow:0 8px 24px rgba(0,0,0,.35); opacity:0; pointer-events:none; transform:translate(-50%,4px); transition:opacity .15s,transform .15s; }
    .tooltip-button:hover + .tooltip-text,.tooltip-button:focus + .tooltip-text { opacity:1; transform:translate(-50%,0); }
    .advanced { margin-top:16px; border:1px solid var(--border); border-radius:10px; background:rgba(12,18,36,.5); overflow:hidden; }
    .advanced summary { padding:12px 14px; color:var(--yellow); font-size:.85rem; font-weight:bold; letter-spacing:.04em; cursor:pointer; list-style:none; }
    .advanced summary::-webkit-details-marker { display:none; }
    .advanced summary::after { content:"+"; float:right; color:var(--muted); font-size:1.1rem; line-height:.8; }
    .advanced[open] summary { border-bottom:1px solid var(--border); }
    .advanced[open] summary::after { content:"−"; }
    .advanced-body { padding:0 14px 14px; }
    .footer { margin-top:20px; }
    .footer .link-button { width:100%; }
    .message { grid-column:1 / -1; padding:24px; color:var(--muted); text-align:center; line-height:1.6; }
    .message.error { border-color:rgba(255,114,128,.55); background:rgba(255,114,128,.1); color:#ffd8dc; }
    .note { margin-top:18px; padding:12px; border-left:3px solid var(--yellow); background:rgba(247,201,72,.08); color:var(--muted); font-size:.9rem; line-height:1.5; }
    @media (max-width:1100px) { .filters { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:650px) { .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:480px) { .filters { grid-template-columns:1fr; } .bar { align-items:stretch; } .bar button { width:100%; } }
    .tabs-wrap { width:min(984px,calc(100% - 32px)); margin-left:auto; margin-right:auto; }
    #aba-mercados { display:grid; grid-template-columns:280px minmax(0,680px); justify-content:center; gap:24px; align-items:start; margin-top:16px; }
    #aba-mercados .panel { position:sticky; top:16px; margin-bottom:0; }
    #aba-mercados .filters { grid-template-columns:1fr; }
    #aba-mercados .actions { flex-direction:column; align-items:stretch; }
    #aba-mercados .actions .status { display:block; text-align:center; }
    @media (max-width:900px) { #aba-mercados { grid-template-columns:minmax(0,680px); } #aba-mercados .panel { position:static; } .tabs-wrap { width:min(680px,calc(100% - 32px)); } }
    .markets { max-width:680px; margin:0; }
    .card { font-size:1.1rem; }
    .card .row { font-size:1.05rem; }
    .card .section-title { font-size:1rem; }
    .card .highlight { font-size:1.4rem; }
    .card .score-value { font-size:1.25rem; }
    .card .link-button { font-size:1.05rem; }
  </style>
</head>
<body>
  <header><div class="tabs-wrap"><h1>Polymarket Bonding Map</h1></div></header>
  <main id="aba-mercados" class="container">
    <section class="panel">
      
      
      <form id="formulario">
        <div class="filters">
          <div class="field"><label for="dias">Resolução em até (dias)</label><input id="dias" type="number" min="1" max="30" value="7"></div>
          <div class="field"><label for="prob-min">Probabilidade mínima (%)</label><input id="prob-min" type="number" min="1" max="99" step="0.1" value="90"></div>
          <div class="field"><label for="prob-max">Probabilidade máxima (%)</label><input id="prob-max" type="number" min="1" max="99" step="0.1" value="99"></div>
          
          
          <div class="field"><label for="orcamento">Simular compra de (US$)</label><input id="orcamento" type="number" min="0.01" step="any" value="100"></div>
          
        </div>
        <div class="actions"><button id="aplicar" type="submit">Aplicar filtros</button><button id="restaurar" class="secondary" type="button">Restaurar padrão</button><span id="status" class="status">Aguardando consulta...</span></div>
      </form>
      
    </section>
    
    <section id="resultados" class="markets"><div class="message">A página foi carregada. Consultando a Polymarket...</div></section>
  </main>
  <script>
    (function(){
      "use strict";
      var TAMANHO_PAGINA=100,TOTAL_DE_PAGINAS=10,MAXIMO_CANDIDATOS_PARA_LIVRO=300,LOTE_LIVROS=20,MAX_PAGINAS=40,busy=false;
      var formulario=document.getElementById("formulario"),campoDias=document.getElementById("dias"),campoProbMin=document.getElementById("prob-min"),campoProbMax=document.getElementById("prob-max"),campoOrcamento=document.getElementById("orcamento"),botaoAplicar=document.getElementById("aplicar"),botaoRestaurar=document.getElementById("restaurar"),status=document.getElementById("status"),resultados=document.getElementById("resultados");
      function esc(v){var e=document.createElement("div");e.textContent=v==null?"":String(v);return e.innerHTML;}
      function money(v,d){var n=Number(v);if(!isFinite(n))return"Não informado";d=d||0;return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:d,maximumFractionDigits:d}).format(n);}
      function pct(v){var n=Number(v);return isFinite(n)?n.toFixed(2)+"%":"Não informado";}
      function arr(v){if(Array.isArray(v))return v;if(typeof v==="string"){try{var x=JSON.parse(v);return Array.isArray(x)?x:[];}catch(e){return [];}}return [];}
      function filters(){var d=Number(campoDias.value),a=Number(campoProbMin.value),b=Number(campoProbMax.value),l=10000,s=5,o=Number(campoOrcamento.value);if(!isFinite(d)||d<1||d>30)throw new Error("Informe entre 1 e 30 dias.");if(!isFinite(a)||!isFinite(b)||a<1||b>99||a>b)throw new Error("A probabilidade mínima deve ser menor ou igual à máxima, entre 1% e 99%.");if(!isFinite(l)||l<0)throw new Error("A liquidez mínima deve ser zero ou maior.");if(!isFinite(s)||s<0||s>100)throw new Error("Informe um spread máximo entre 0 e 100 pontos.");if(!isFinite(o)||o<=0)throw new Error("Informe um orçamento maior que zero.");return{dias:d,pmin:a/100,pmax:b/100,probMin:a,probMax:b,liq:l,spreadPts:s,spreadMax:s/100,orcamento:o,exigirProfundidade:false};}
      function endDate(m){var xs=[m.endDateIso,m.endDate,m.umaEndDateIso,m.umaEndDate];for(var i=0;i<xs.length;i++){if(xs[i]){var d=new Date(xs[i]);if(!isNaN(d.getTime()))return d;}}return null;}
      function hours(m){var d=endDate(m);return d?(d.getTime()-Date.now())/3600000:null;}
      function time(h){if(!isFinite(h))return"Não informado";if(h<=0)return"Em resolução";var d=Math.floor(h/24),r=Math.floor(h%24);return d>0?d+"d e "+r+"h":r+"h";}
      function dateText(m){var d=endDate(m);return d?new Intl.DateTimeFormat("pt-BR",{dateStyle:"medium",timeStyle:"short"}).format(d):"Não informada";}
      function firstNumber(xs){for(var i=0;i<xs.length;i++){var n=Number(xs[i]);if(isFinite(n)&&n>=0)return n;}return null;}
      function liquidity(m){var n=firstNumber([m.liquidityClob,m.liquidityNum,m.liquidity,m.liquidityAmm]);return n===null?0:n;}
      function volume24h(m){return firstNumber([m.volume24hrClob,m.volume24hr,m.volume24Hour,m.volume24h]);}
      function positions(m){var ns=arr(m.outcomes),ps=arr(m.outcomePrices),ts=arr(m.clobTokenIds),out=[];for(var i=0;i<ns.length;i++){var p=Number(ps[i]);if(isFinite(p))out.push({name:String(ns[i]),price:p,tokenId:ts[i]?String(ts[i]):null});}return out;}
      function eligible(m,f){var ps=positions(m);for(var i=0;i<ps.length;i++)if(ps[i].price>=f.pmin&&ps[i].price<=f.pmax)return ps[i];return null;}
      function baseFilter(ms,f){var ok=[],d={received:ms.length,noDate:0,outside:0,lowLiquidity:0,price:0,noToken:0};for(var i=0;i<ms.length;i++){var m=ms[i],h=hours(m),l=liquidity(m),p=eligible(m,f);if(h===null){d.noDate++;continue;}if(h<=0||h>f.dias*24){d.outside++;continue;}if(l<=f.liq){d.lowLiquidity++;continue;}if(!p){d.price++;continue;}if(!p.tokenId){d.noToken++;continue;}ok.push({market:m,position:p});}ok.sort(function(a,b){return liquidity(b.market)-liquidity(a.market);});return{ok:ok,diag:d};}
      function bestBid(xs){var x=null;for(var i=0;i<xs.length;i++){var p=Number(xs[i].price);if(isFinite(p)&&(x===null||p>x))x=p;}return x;}
      function bestAsk(xs){var x=null;for(var i=0;i<xs.length;i++){var p=Number(xs[i].price);if(isFinite(p)&&(x===null||p<x))x=p;}return x;}
      function normalizeAsks(xs){var out=[];for(var i=0;i<xs.length;i++){var p=Number(xs[i].price),s=Number(xs[i].size);if(isFinite(p)&&p>0&&isFinite(s)&&s>0)out.push({price:p,size:s});}out.sort(function(a,b){return a.price-b.price;});return out;}
      function simulate(asks,budget,t){t=t||{rate:0,exp:1};var left=budget,cost=0,shares=0,fees=0,worst=null;for(var i=0;i<asks.length&&left>0;i++){var level=asks[i],fee=feeShare(level.price,t),unit=level.price+fee,capacity=unit*level.size,spend=Math.min(left,capacity),qty=spend/unit;if(spend>0){cost+=spend;shares+=qty;fees+=qty*fee;left-=spend;worst=level.price;}}var complete=left<0.000001&&cost>0,avg=shares>0?cost/shares:null,payout=shares,profit=payout-cost;return{complete:complete,cost:cost,shares:shares,fees:fees,remaining:left,average:avg,worst:worst,payout:payout,profit:profit,returnPct:cost>0?(profit/cost)*100:null};}
      function bookSummary(book,f,m){var t=taxaMercado(m);var bids=Array.isArray(book.bids)?book.bids:[],asksRaw=Array.isArray(book.asks)?book.asks:[],bid=bestBid(bids),ask=bestAsk(asksRaw),asks=normalizeAsks(asksRaw);if(bid===null||ask===null)return{available:false,reason:"Livro sem bid ou ask disponível."};var spread=ask-bid;return{available:true,bid:bid,ask:ask,spread:spread,points:spread*100,gross:((1/(ask+feeShare(ask,t)))-1)*100,fee:t,asks:asks,simulation:simulate(asks,f.orcamento,t)};}
      function getBook(token){return fetch("https://clob.polymarket.com/book?token_id="+encodeURIComponent(token)).then(function(r){if(!r.ok)throw new Error("Livro indisponível: erro "+r.status+".");return r.json();});}
      function fetchBooks(cs,f){var i=0;function lote(){if(i>=cs.length)return Promise.resolve(cs);var parte=cs.slice(i,i+LOTE_LIVROS);i+=LOTE_LIVROS;return Promise.all(parte.map(function(c){return getBook(c.position.tokenId).then(function(book){c.book=bookSummary(book,f,c.market);return c;}).catch(function(e){c.book={available:false,reason:e.message};return c;});})).then(lote);}return lote();}
      function allowed(cs,f){return cs.filter(function(c){if(!c.book||!c.book.available||c.book.spread>f.spreadMax)return false;if(f.exigirProfundidade&&!c.book.simulation.complete)return false;return true;});}
      function scoreClass(book,f){if(!book||!book.available)return"bad";if(book.spread<=f.spreadMax/2)return"good";return book.spread<=f.spreadMax?"warning":"bad";}
      function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
      function scoreValue(v,max){return Math.round(clamp(v,0,max));}
      function taxaMercado(m){var fs=m&&m.feeSchedule;if(typeof fs==="string"){try{fs=JSON.parse(fs);}catch(e){fs=null;}}if(m&&m.feesEnabled===false)return{rate:0,exp:1};if(fs&&fs.rate!==undefined&&fs.rate!==null){var r=Number(fs.rate),x=Number(fs.exponent);return{rate:isFinite(r)?r:0.05,exp:isFinite(x)&&x>0?x:1};}return{rate:0.05,exp:1};}
      function feeShare(p,t){return t.rate*Math.pow(p*(1-p),t.exp);}
      function aoVivo(m){if(!m)return false;if(m.live===true)return true;var ev=Array.isArray(m.events)?m.events:[];for(var i=0;i<ev.length;i++)if(ev[i]&&ev[i].live===true)return true;var g=m.gameStartTime||(ev[0]&&ev[0].gameStartTime);if(g){var d=new Date(String(g).replace(" ","T"));if(!isNaN(d.getTime())&&d.getTime()<=Date.now())return true;}return false;}
      function bondingScore(c,f){var b=c.book,m=c.market,sm=b&&b.simulation;if(!b||!b.available||!sm||sm.cost<=0)return{total:0};var h=hours(m),liq=liquidity(m),gross=Math.max(0,Number(sm.returnPct)||0),ret=5*clamp(gross/15,0,1),tempo=3*(1-clamp((h===null?0:h)/(f.dias*24),0,1)),lq=2*clamp(liq/Math.max(f.liq,f.orcamento*20,1),0,1);return{total:ret+tempo+lq};}
      function acuracia(h){if(h===null||!isFinite(h))return"Não informado";var v=h<=4?98.6:h<=12?97.1:h<=24?96.4:h<=168?94.2:90.1;return v.toFixed(1)+"%";}
      function scoreHtml(score){return'<div class="score-card"><span class="score-value">'+Number(score.total).toFixed(1)+'/10</span></div>';}
      function marketUrl(m){return m.slug?"https://polymarket.com/market/"+encodeURIComponent(m.slug):null;}
      function simHtml(s,f){if(!s||s.cost<=0)return'<div class="section"><h3 class="section-title">Simulação de profundidade</h3><div class="row"><span>Simulação</span><strong class="bad">Sem asks utilizáveis</strong></div></div>';var state=s.complete?"depth-ok":"depth-low",label=s.complete?"Orçamento coberto pelo livro":"Profundidade insuficiente";return'<div class="section '+state+'"><h3 class="section-title">Simulação</h3><div class="details">'+(s.complete?'':'<div class="row"><span>Status</span><strong class="warning">'+label+'</strong></div>')+'<div class="row"><span>Custo</span><strong>'+money(s.cost,2)+'</strong></div><div class="row"><span>Share</span><strong>'+s.shares.toFixed(2)+'</strong></div><div class="row"><span>Preço médio</span><strong>'+money(s.average,3)+'</strong></div><div class="row"><span>Payout</span><strong>'+money(s.payout,2)+'</strong></div><div class="row"><span>Lucro (após taxas)</span><strong class="good">'+money(s.profit,2)+' ('+pct(s.returnPct)+')</strong></div>'+(s.complete?'':'<div class="row"><span>Orçamento não alocado</span><strong class="warning">'+money(s.remaining,2)+'</strong></div>')+'</div></div>';}
      function card(c,f){var m=c.market,p=c.position,b=c.book,q=esc(m.question||"Mercado sem título"),name=esc(p.name),v=volume24h(m),score=bondingScore(c,f),bookHtml;if(b&&b.available){bookHtml=simHtml(b.simulation,f);}else{bookHtml='<div class="section"><h3 class="section-title">Livro CLOB</h3><div class="row"><span>Consulta do livro</span><strong class="bad">'+esc(b&&b.reason?b.reason:"Não disponível")+'</strong></div></div>';}
        var url=marketUrl(m),title=url?'<a class="market-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Abrir mercado na Polymarket">'+q+'</a>':q;
        return'<article class="card"><div class="title-row">'+scoreHtml(score)+'<h2 class="question">'+title+'</h2></div><div class="highlights"><div class="highlight '+(/^(yes|sim)$/i.test(String(p.name))?"positive":"negative")+'">'+name+' '+(p.price*100).toFixed(1)+'%</div></div><div class="details"><div class="row"><span>Resolve em</span><strong>'+esc(time(hours(m)))+' ('+esc(dateText(m))+')</strong></div><div class="row"><span>Liquidez informada</span><strong>'+money(liquidity(m))+'</strong></div><div class="row"><span>Volume em 24h</span><strong>'+(v===null?"Não informado":money(v))+'</strong></div><div class="row"><span>Acurácia</span><strong>'+acuracia(hours(m))+'</strong></div></div>'+bookHtml+'</article>';}
      function loading(on){busy=on;botaoAplicar.disabled=on;botaoRestaurar.disabled=on;botaoAplicar.textContent=on?"Aplicando...":"Aplicar filtros";}
      function showError(msg){resultados.innerHTML='<div class="message error"><strong>Não foi possível carregar os mercados.</strong><br>'+esc(msg)+'</div>';status.textContent="Ocorreu um erro na consulta.";}
      function showNoneBase(d,f){resultados.innerHTML='<div class="message">Nenhum mercado chegou à etapa de consulta do livro CLOB.<br><br><strong>Critérios iniciais:</strong><br>Resolução em até '+f.dias+' dia(s)<br>Probabilidade entre '+f.probMin+'% e '+f.probMax+'%<br>Liquidez superior a '+money(f.liq)+'<br><br><strong>Diagnóstico:</strong><br>Recebidos da API: '+d.received+'<br>Sem data válida: '+d.noDate+'<br>Fora da janela: '+d.outside+'<br>Liquidez insuficiente: '+d.lowLiquidity+'<br>Probabilidade fora da faixa: '+d.price+'<br>Sem token CLOB: '+d.noToken+'</div>';}
      function showNoneBook(cs,f){var noBook=cs.filter(function(c){return !c.book||!c.book.available;}).length,high=cs.filter(function(c){return c.book&&c.book.available&&c.book.spread>f.spreadMax;}).length,shallow=cs.filter(function(c){return c.book&&c.book.available&&!c.book.simulation.complete;}).length;resultados.innerHTML='<div class="message">Nenhum candidato passou em todos os filtros do livro CLOB.<br><br><strong>Condições atuais:</strong><br>Spread máximo: '+f.spreadPts.toFixed(1)+' pontos ('+money(f.spreadMax,3)+')<br>Orçamento simulado: '+money(f.orcamento,2)+'<br><br>Candidatos consultados: '+cs.length+'<br>Livros indisponíveis: '+noBook+'<br>Spread acima do limite: '+high+'<br>Profundidade insuficiente: '+shallow+'</div>';}
      function pageUrl(p,dmin,dmax){return "https://gamma-api.polymarket.com/markets?active=true&closed=false&limit="+TAMANHO_PAGINA+"&offset="+(p*TAMANHO_PAGINA)+"&end_date_min="+encodeURIComponent(dmin)+"&end_date_max="+encodeURIComponent(dmax);}
      function page(p,dmin,dmax){return fetch(pageUrl(p,dmin,dmax)).then(function(r){if(!r.ok)throw new Error("A API respondeu com erro "+r.status+" na página "+(p+1)+".");return r.json();});}
      function buscarMercados(f){var agora=new Date(),dmin=agora.toISOString(),dmax=new Date(agora.getTime()+f.dias*86400000).toISOString();
        function keyset(){var todos=[],n=0;function proxima(cur){var u="https://gamma-api.polymarket.com/markets/keyset?closed=false&limit="+TAMANHO_PAGINA+"&end_date_min="+encodeURIComponent(dmin)+"&end_date_max="+encodeURIComponent(dmax)+(cur?"&after_cursor="+encodeURIComponent(cur):"");return fetch(u).then(function(r){if(!r.ok)throw new Error("Erro "+r.status+" na busca por cursor.");return r.json();}).then(function(d){var ms=Array.isArray(d)?d:((d&&d.markets)||[]);todos=todos.concat(ms);n++;if(d&&d.next_cursor&&ms.length&&n<MAX_PAGINAS)return proxima(d.next_cursor);return todos;});}return proxima(null);}
        function legado(){var jobs=[];for(var p=0;p<TOTAL_DE_PAGINAS;p++)jobs.push(page(p,dmin,dmax));return Promise.all(jobs).then(function(pages){var ms=[];for(var i=0;i<pages.length;i++)if(Array.isArray(pages[i]))ms=ms.concat(pages[i]);return ms;});}
        return keyset().catch(function(e){console.warn("Busca por cursor indisponível; usando paginação por offset.",e);return legado();});}
      function load(){var f;try{f=filters();}catch(e){showError(e.message);return;}status.textContent="Consultando mercados da Polymarket...";if(!resultados.querySelector("article"))resultados.innerHTML='<div class="message">Carregando mercados da Polymarket...</div>';loading(true);buscarMercados(f).then(function(ms){ms=ms.filter(function(m){return m&&m.active!==false&&m.closed!==true&&!aoVivo(m);});if(!ms.length)throw new Error("A API não retornou mercados nas páginas consultadas.");var x=baseFilter(ms,f);if(!x.ok.length){showNoneBase(x.diag,f);status.textContent="Foram analisados "+x.diag.received+" mercados; nenhum passou nos filtros iniciais.";return null;}var cs=x.ok.slice(0,MAXIMO_CANDIDATOS_PARA_LIVRO);status.textContent="Consultando o livro CLOB e simulando "+cs.length+" candidato(s)...";return fetchBooks(cs,f).then(function(done){return{markets:ms,candidates:done};});}).then(function(data){if(!data)return;var ok=allowed(data.candidates,f);if(!ok.length){showNoneBook(data.candidates,f);status.textContent="Nenhum candidato passou nos filtros de spread e profundidade.";return;}ok.sort(function(a,b){var sa=bondingScore(a,f),sb=bondingScore(b,f);if(sb.total!==sa.total)return sb.total-sa.total;if(a.book.simulation.complete!==b.book.simulation.complete)return a.book.simulation.complete?-1:1;return a.book.spread-b.book.spread;});resultados.innerHTML=ok.map(function(c){return card(c,f);}).join("");status.textContent=ok.length+(ok.length===1?" mercado compatível":" mercados compatíveis");}).catch(function(e){console.error(e);showError(e.message);}).finally(function(){loading(false);});}
      formulario.addEventListener("submit",function(e){e.preventDefault();load();});botaoRestaurar.addEventListener("click",function(){campoDias.value=7;campoProbMin.value=90;campoProbMax.value=99;campoOrcamento.value=100;load();});load();setInterval(function(){if(!busy)load();},60000);
    })();
  </script>
